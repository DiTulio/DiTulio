name: Generate Stats Images

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Generate stats SVG
        uses: anuraghazra/github-readme-stats@latest
        with:
          username: DiTulio
          show_icons: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
